name: Build & Release Clipwave APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK for release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk clipwave.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipwave-apk
          path: clipwave.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Clipwave Mobile v1.0.0 (Android APK)"
          body: |
            ### 🚀 Clipwave Android APK Ready for Installation!
            
            - **Download File**: `clipwave.apk` (attached below)
            - **Compatibility**: Android 7.0 and up
            
            #### 📥 Quick Installation:
            1. Tap `clipwave.apk` below on your phone to download.
            2. Open the downloaded file and tap **Install** (enable "Install unknown apps" if prompted).
            3. Done! Enjoy 1-click video and audio downloads.
          files: clipwave.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
